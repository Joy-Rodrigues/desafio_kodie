services:
  api:
    build: .
    container_name: classificador-api
    env_file: .env
    environment:
      DATA_DIR: /data
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: classificador-n8n
    ports:
      - "5678:5678"
    environment:
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
      N8N_SECURE_COOKIE: "false"   # acesso via http://localhost, sem HTTPS
      N8N_RUNNERS_ENABLED: "true"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/workflows:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  n8n_data:
